version: '3.7'

services:
  app:
    build: ..
    volumes:
      - app-logs:/src/logs
      - ./data:/src/data
      - ../app:/src/app
      - ../tests:/src/tests
    environment:
      - TZ
    restart: on-failure
    expose:
      - 8000
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
    links:
      - db
    networks:
      - cameo

  db:
    image: postgres:16.2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - ALLOW_IP_RANGE=0.0.0.0/0
      - RUN_AS_ROOT=true
      - TZ=Iran
    expose:
      - "5432"
    ports:
      - "5432"
    restart: on-failure
    healthcheck:
      test: "PGPASSWORD=password pg_isready -h 127.0.0.1 -U cameo -d db"
    networks:
      - cameo

volumes:
  postgis-data:
  app-logs:

networks:
  cameo:
    name: cameo
    driver: bridge