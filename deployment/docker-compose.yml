version: '3.7'

services:
  app:
    build: 
      context: ..
      dockerfile: deployment/docker/DockerFile.app
    volumes:
      - app-logs:/src/logs
      - ../app:/src/app
      - ../tests:/src/tests
    environment:
      - TZ
    restart: on-failure
    expose:
      - 8000
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
    links:
      - db
    networks:
      - cameo

  db:
    build:
      dockerfile: ./docker/DockerFile.db
    command:
      [
        "postgres",
        "-c",
        "log_statement=all",
        "-c",
        "log_destination=stderr",
        "-c",
        "shared_preload_libraries=pg_cron",
        "-c",
        "cron.database_name=${POSTGRES_DB}",
      ]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - ALLOW_IP_RANGE=0.0.0.0/0
      - RUN_AS_ROOT=true
      - TZ=Iran
    expose:
      - "5432"
    ports:
      - "5432:5432"
    restart: on-failure
    healthcheck:
      test: "PGPASSWORD=password pg_isready -h 127.0.0.1 -U cameo -d db"
    networks:
      - cameo

volumes:
  postgres-data:
  app-logs:

networks:
  cameo:
    name: cameo
    driver: bridge